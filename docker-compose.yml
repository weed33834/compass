# Compass 自托管编排：PostgreSQL + 应用 + 上传持久卷
# 用法：
#   1. 复制并填写配置：cp .env.example .env
#   2. 构建并启动：   docker compose up -d --build
#   3. 初始化数据库： docker compose run --rm app pnpm prisma migrate deploy
#   4. （可选）灌入官方题库：docker compose exec app node scripts/import-official-banks.mjs
#   5. 反向代理：用 Caddyfile 反代 127.0.0.1:3000 并自动签发 TLS

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: compass
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: compass
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compass"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://compass:change-me@db:5432/compass?schema=public
      NEXTAUTH_URL: https://your-domain.com
      NEXTAUTH_SECRET: change-me-secret
      NEXT_PUBLIC_SITE_URL: https://your-domain.com
      NODE_ENV: production
      TRUSTED_PROXY_IPS: 127.0.0.1
    ports:
      - "3000:3000"
    volumes:
      # 持久化用户上传的媒体文件（题目图片/音频），否则容器重建即丢失
      - uploads:/app/public/uploads

volumes:
  pgdata:
  uploads:
